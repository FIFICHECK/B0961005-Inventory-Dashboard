<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B0961005 訪問批准</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .box {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08); max-width: 420px; width: 100%; padding: 36px 32px; text-align: center;
  }
  h2 { color: #1e293b; margin: 0 0 10px; font-size: 1.25rem; }
  p { color: #64748b; font-size: .9rem; margin: 0 0 20px; line-height: 1.6; word-break: break-all; }
  #email-show { color: #1e293b; font-weight: 700; }
  button {
    width: 100%; padding: 12px 14px; border: none; border-radius: 8px;
    background: #1e40af; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 10px;
  }
  button:hover { background: #1e3a8a; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #back-btn { background: #eee; color: #555; }
  #back-btn:hover { background: #ddd; }
  #status { margin-top: 14px; font-size: .9rem; min-height: 1.2em; font-weight: 600; }
  .ok { color: #2e7d32; }
  .err { color: #c62828; }
</style>
</head>
<body>
<div class="box">
  <div style="font-size:2rem;margin-bottom:8px;">🔐</div>
  <h2>批准訪問申請</h2>
  <p>你正在批准以下 email 訪問 <b>B0961005 Store Dashboard</b>：<br><span id="email-show">—</span></p>
  <button id="approve-btn">✅ 批准訪問</button>
  <button id="back-btn" onclick="history.back()">⬅️ 返回</button>
  <div id="status"></div>
</div>
<script>
/* Access-Approver webhook v2（id + base64 token）— 2026-08-29 重建（舊 webhook 被刪）*/
const WH_ID = '1543190226883715135';
const WH_TOKEN_B64 = 'TWFLSkZJc3AtSWctaGpMeXFqVUJySFVObWRaSWtZcnpZTk1JcFViWXgyaFFVSktwVjk5VlRYMVpTYWxLd2RCTk9zTmQ=';
const PREFIX = '[APPROVE-REQ]';

function params() {
  const p = new URLSearchParams(location.search);
  return { email: (p.get('email') || '').trim().toLowerCase(), t: (p.get('t') || '').trim() };
}

function sendApprove() {
  const btn = document.getElementById('approve-btn');
  const status = document.getElementById('status');
  const { email, t } = params();
  if (!(email && email.length > 1)) {
    status.textContent = '❌ 無效請求（缺少 Email）';
    status.className = 'err';
    return;
  }
  btn.disabled = true;
  btn.textContent = '⏳ 送出批准中…';
  status.textContent = '';
  const payload = JSON.stringify({ email: email, t: t, ts: new Date().toISOString(), repo: 'B0961005' });
  const b64 = btoa(unescape(encodeURIComponent(payload)));
  fetch('https://discord.com/api/v10/webhooks/' + WH_ID + '/' + atob(WH_TOKEN_B64), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: PREFIX + ' ' + b64, username: 'Access-Approver' })
  }).then(function(r) {
    if (r.ok) {
      status.textContent = '✅ 已送出批准！訪問者幾分鐘內即可進入。';
      status.className = 'ok';
      btn.textContent = '✅ 已批准';
    } else {
      status.textContent = '❌ 送出失敗 HTTP ' + r.status + ' — 請再試';
      status.className = 'err';
      btn.disabled = false;
      btn.textContent = '✅ 批准訪問';
    }
  }).catch(function() {
    status.textContent = '❌ 網絡錯誤 — 請再試';
    status.className = 'err';
    btn.disabled = false;
    btn.textContent = '✅ 批准訪問';
  });
}

document.getElementById('email-show').textContent = params().email || '（未知）';
document.getElementById('approve-btn').addEventListener('click', sendApprove);
</script>
</body>
</html>
